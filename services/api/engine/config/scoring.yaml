# Scoring constants. Changing anything here changes the engine version
# (the hash of this file is part of model_runs.engine_version).
# See docs/04-data-and-scoring.md §3–4.

version: 1

grid:
  resolution: 9            # H3 resolution (~0.105 km² per cell, ~300 m centre spacing)

score:
  alpha: 2.2               # logistic steepness on log(g); g = 2 → ~82, g = 0.5 → ~18
  g_floor: 0.05            # g is floored before log so zero population doesn't give -inf
  g_cap: 4.0               # g is capped to [0, 4]
  min_supply: 0.5          # people_per_outlet = pop / max(supply_est, 0.5)
  draft_threshold: 60      # cells at or above this score can become draft recommendations
  max_drafts_per_category: 5

status_factor:             # how much a competitor counts, by business status
  OPERATIONAL: 1.0
  CLOSED_TEMPORARILY: 0.3
  CLOSED_PERMANENTLY: 0.0
  unknown: 0.9             # OSM has no status; assume mostly open

quality:                   # supply_quality_adj: a poorly rated competitor counts less
  enabled: true
  neutral_rating: 4.0      # rating at which a place counts as exactly 1
  per_star: 0.15           # +/- weight per star away from neutral
  min_weight: 0.6
  max_weight: 1.2
  min_rating_count: 20     # fewer reviews than this → weight 1 (not enough evidence)

ground_correction:
  min: 0.5
  max: 4.0
  fresh_days: 90           # ground count counts as "recent" for the confident band
  usable_days: 365         # older ground counts are ignored

adjustments:
  survey_need:
    max_points: 10
    min_n: 15              # no effect below this sample size
    full_effect_n: 60      # full effect at or above this sample size
    neutral_share: 0.25    # share travelling far that we treat as "normal"
  activity_proxy:
    max_points: 8
    saturation: 150        # businesses in catchment for full effect
  review_pain:
    max_points: 6
  rent_band:
    max_points: 10         # penalty when rent is in the top quartile for the area
    min_n: 3
  low_population:
    cap: 40

uncertainty:
  samples: 400
  seed: 20261108
  population_rel_sd: 0.15  # WorldPop ±15%
  survey_min_sd: 0.05
  # Outlets the map may be missing in a catchment (exponential mean), by what ground
  # truth we have. Without this, a cell with zero mapped shops would look falsely certain.
  hidden_supply_mean:
    none: 0.6              # no ground counts anywhere yet
    area: 0.3              # only the area-wide ground-count ratio
    local: 0.05            # a ground count inside this catchment

confidence:                # evaluated top-down; first match wins
  confident:
    max_width: 20
    survey_n: 40
  fairly_sure:
    max_width: 30
    survey_n: 20
  early_signal:
    max_width: 45

categories:                # per-category constants (catchment_k also lives in the DB)
  pharmacy:
    catchment_k: 3         # ≈ 10-minute walk
    decay_lambda_m: 600    # weight = exp(-distance / lambda)
    min_population: 3000
    informal_weight: 0.5
    activity_weight: 0.5   # walk-in sensitivity, 0–1
    travel_minutes: 10     # survey: "travel more than X minutes"
  cafe:
    catchment_k: 2
    decay_lambda_m: 400
    min_population: 1500
    informal_weight: 0.8
    activity_weight: 1.0
    travel_minutes: 5
  salon:
    catchment_k: 3
    decay_lambda_m: 600
    min_population: 2500
    informal_weight: 0.6
    activity_weight: 0.6
    travel_minutes: 10
  coaching:
    catchment_k: 6
    decay_lambda_m: 1200
    min_population: 6000
    informal_weight: 0.7   # home tuition is common and rarely mapped
    activity_weight: 0.2
    travel_minutes: 20
  hardware:
    catchment_k: 5
    decay_lambda_m: 1000
    min_population: 8000
    informal_weight: 0.3
    activity_weight: 0.4
    travel_minutes: 20
