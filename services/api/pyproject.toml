[project]
name = "siteline-api"
version = "0.1.0"
description = "Siteline API and data engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "h3>=4.5.0",
    "httpx>=0.28.1",
    "numpy>=2.5.4",
    "psycopg[binary,pool]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyjwt[crypto]>=2.15.1",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "rasterio>=1.5.2",
    "shapely>=2.2.0",
    "slowapi>=0.1.10",
    "structlog>=26.1.0",
    "typer>=0.28.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
engine = "engine.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "engine"]

[tool.hatch.build.targets.wheel.force-include]
"engine/config" = "engine/config"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.4",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003", "N818", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs a Postgres database (TEST_DATABASE_URL)",
]
addopts = "-q"

[tool.coverage.run]
source = ["engine", "app"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
check_untyped_defs = true
