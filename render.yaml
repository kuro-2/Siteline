# Render blueprint for the API (free plan sleeps when idle). Secrets are set in the dashboard.
services:
  - type: web
    name: nukkad-api
    runtime: docker
    rootDir: services/api
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    healthCheckPath: /v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: CONSENT_VERSION
        value: 2026-11-v1
      - key: DEVICE_HASH_SALT
        sync: false
      - key: LLM_PROVIDER
        value: template
      - key: SENTRY_DSN
        sync: false
