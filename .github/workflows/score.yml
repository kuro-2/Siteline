name: Score
# After any ingest: rebuild features and scores, draft explanations; monthly outcome scan.
on:
  workflow_run:
    workflows: [Ingest]
    types: [completed]
  schedule:
    - cron: "0 22 2 * *"    # monthly outcome scan, 2nd 03:30 IST
  workflow_dispatch:

env:
  APP_ENV: production
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  PILOT_AREA_SLUG: ${{ vars.PILOT_AREA_SLUG || 'pilot' }}
  LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'template' }}
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

jobs:
  score:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/api } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Score and draft
        if: github.event_name != 'schedule'
        run: uv run engine score run && uv run engine explain draft
      - name: Outcomes
        if: github.event_name == 'schedule'
        run: uv run engine outcomes scan
